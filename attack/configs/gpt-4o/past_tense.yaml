# Dataset
data_path: ../data/txt/teleai_samples_500_500.jsonl
data_offset: 0
image_root_in: null

# Rewrite model (used to rewrite queries into past tense)
rewrite_model_type: azure_openai
rewrite_model_name: gpt-4o
rewrite_model_path: ""

# Target model (model under test)
target_model_type: azure_openai
target_model_name: gpt-4o
target_model_path: ""

# Optional prompts / runtime
target_system_prompt: null
rewrite_template: ""
device: cpu

# Generation
max_n_tokens: 150
temperature: 1.0
target_top_p: 1.0

# Evaluator
evaluator_type: pattern
evaluator_path: null

# Auth / endpoints
api_key: null
base_url: null
azure_key: ${AZURE_OPENAI_API_KEY}
azure_url: ${AZURE_OPENAI_ENDPOINT}
grok_key: null
grok_url: null

# Results
res_save_path: ../data/attack_results/gpt-4o/past_tense.jsonl
log_path: ./logs/past_tense.log
