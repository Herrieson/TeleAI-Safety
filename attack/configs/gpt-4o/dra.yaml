# Dataset
data_path: ../data/txt/teleai_samples_500_500.jsonl

# Target model (Azure OpenAI deployment name)
model_type: azure_openai
target_model_name: gpt-4o
target_model_path: ""

# Detoxify (required for moderation; set to your checkpoint paths)
# detoxify_model_path: "./detoxify/Detoxify-original.pth"
detoxify_model_path: null
# detoxify_config_path: "./detoxify/config_original.json"
detoxify_config_path: null

# DRA parameters
iters: 5
system_prompt: "You are a helpful assistant."
device: cpu
default_toxic_trunc: 0.5
default_benign_trunc: 0.5
em_t: 0.7

# Evaluator
evaluator_type: pattern
evaluator_path: null

# Auth / endpoints
api_key: null
base_url: null
azure_key: ${AZURE_OPENAI_API_KEY}
azure_url: ${AZURE_OPENAI_ENDPOINT}
grok_key: null
grok_url: null

# Paths
res_save_path: ../data/attack_results/gpt-4o/dra.jsonl
log_path: ./logs/dra.log
template_path: null
