grok_key: null
grok_url: null

# Generation
target_max_n_tokens: 512
target_temperature: 0.7
target_top_p: 1.0

# SCAV prompt optimization files
prompt_file: ./methods/scav/optimized_instructions_teleai.csv
optimized_file_8b: ./methods/scav/optimized_instructions_teleai.csv
optimized_file_70b: ./methods/scav/optimized_instructions_teleai.csv
max_round: 1

# Results
res_save_path: ../data/attack_results/gpt-4o/scav.jsonl
