# Dataset
data_path: ../data/txt/teleai_samples_500_500.jsonl
data_offset: 0
image_root_in: null

# Attack model (used for branching mutations)
attack_model_type: azure_openai
attack_model_name: gpt-4o
attack_model_path: ""

# Target model (model under test)
target_model_type: azure_openai
target_model_name: gpt-4o
target_model_path: ""

# Eval model (for TAP scoring)
eval_model_type: azure_openai
eval_model_name: gpt-4o
eval_model_path: ""

# Evaluator
evaluator_type: pattern
evaluator_model_path: null

# TAP tree/search parameters
tree_width: 10
tree_depth: 5
root_num: 1
branching_factor: 4
keep_last_n: 3
max_n_attack_attempts: 5

# Generation
attack_max_n_tokens: 500
attack_temperature: 1.0
attack_top_p: 0.9
target_max_n_tokens: 150
target_temperature: 1.0
target_top_p: 1.0
judge_max_n_tokens: 10
judge_temperature: 1.0

# Optional target system prompt
target_system_prompt: null
devices: cpu

# Auth / endpoints
api_key: null
base_url: null
azure_key: ${AZURE_OPENAI_API_KEY}
azure_url: ${AZURE_OPENAI_ENDPOINT}
grok_key: null
grok_url: null

# Results
res_save_path: ../data/attack_results/gpt-4o/tap.jsonl
