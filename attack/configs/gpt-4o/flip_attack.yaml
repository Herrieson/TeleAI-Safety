# Dataset
data_path: ../data/txt/teleai_samples_500_500.jsonl
data_offset: 0
image_root_in: null

# Target model (model under attack)
target_model_type: azure_openai
target_model_name: gpt-4o
target_model_path: ""

# Auth / endpoints
api_key: null
base_url: null
azure_key: ${AZURE_OPENAI_API_KEY}
azure_url: ${AZURE_OPENAI_ENDPOINT}
grok_key: null
grok_url: null

# Generation (null means model defaults)
target_max_n_tokens: null
target_temperature: null
target_top_p: null

# Optional extra system prompt prepended before FlipAttack system prompt
target_system_prompt: null

# FlipAttack options
flip_mode: FCS
cot: false
lang_gpt: false
few_shot: false

# Results
res_save_path: ../data/attack_results/gpt-4o/flip_attack.jsonl
log_path: ./logs/flip_attack.log
