style_name: "enterprise_safety_report_cn_v1"
rules:
  - "执行摘要采用“现状描述 -> 关键指标 -> 商业解读”三句式，先给结论，再给证据。"
  - "章节内优先使用“指标定义 -> 数据观察 -> 诊断结论”的结构，不空谈方法论。"
  - "语气保持审计/评测口吻：明确、克制、可追责，避免营销化措辞。"
  - "风险描述尽量量化，优先引用 ASR/FRR/MDS/WSL/CM 等指标并落到业务后果。"
  - "当结论涉及上线建议时，给出“短期门禁 + 中期优化 + 长期治理”三级动作。"
  - "在模型画像中保留“性格特征”表达（保守/激进、稳定/波动），但必须有指标支撑。"
  - "每段聚焦单一主题，单段不超过 4 句；避免堆砌并列口号。"
snippets:
  - section: "执行摘要"
    text: "综合评价：模型在业务安全性上处于第一梯队。其核心优势不是单点高分，而是“低攻击成功率 + 低商业代价”的协同表现。"
  - section: "执行摘要"
    text: "商业解读：该模型更像“安全优先的执行者”，适合高合规场景直接落地；但在灰区问题上需要结合业务策略做二次编排。"
  - section: "2.1 基础攻防"
    text: "在基础攻防维度，ASR 与 FRR 是一组必须联合观察的指标：前者反映防线强度，后者反映可用性折损。两者平衡优于单项极值。"
  - section: "2.2 攻击分布"
    text: "整体均值无法揭示真实风险面，必须拆解到攻击向量级别，识别“长尾高危点”并建立专项门禁。"
  - section: "2.3 商业风险"
    text: "CM 与 WSL 用于量化不对称损失：同样是错误输出，红线场景的代价远高于一般误拒。上线策略应优先压降高权重错误。"
  - section: "2.3 性格与稳定性"
    text: "Bias 与 MDS 联合刻画模型内生性格。Bias 显示价值取向，MDS 显示防御一致性；二者共同决定线上行为是否可预测。"
  - section: "第3章 横向对标"
    text: "横向对标不追求全榜单叙事，而是围绕待测模型与标杆模型的关键差距，输出可执行的补齐路径。"
  - section: "第4章 纵向诊断"
    text: "若模型呈现“高 ASR 且低波动”，通常意味着结构性防御缺口；若“中等 ASR 但高波动”，通常意味着局部策略未收敛。"
  - section: "第5章 案例复盘"
    text: "案例复盘应同时覆盖正反样本：负例用于暴露防线穿透路径，正例用于验证安全策略在真实问法下仍可稳定生效。"
  - section: "第6章 建议"
    text: "短期动作优先处理高风险攻击面并设发布门禁；中期通过数据与策略协同降低误拒；长期建立模型、网关与人工复核的分层治理。"
  - section: "结论句式"
    text: "诊断结论：模型当前处于“可用性领先但安全成本偏高”的状态，若直接面向公众场景，建议先补齐高代价攻击面的防护闭环。"
  - section: "风险句式"
    text: "商业警示：当前分数结构显示，主要风险并非平均失败率，而是少数高权重错误在关键场景下造成的集中损失。"
