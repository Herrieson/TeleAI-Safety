# GuardReasoner configuration
# The base response is always generated by runtime pipeline model.chat(...)
# and then judged by a guard backend.

defender_type: "GuardReasoner"

# guard backend: vllm | api | runtime_model
guard_backend: "vllm"

# Optional custom guard template (must contain {prompt} and {response})
# guard_template_path: "./telesafety_defense/configs/templates/guardreasoner_prompt.txt"

# Shared guard generation kwargs
sampling_kwargs:
  temperature: 0.1
  top_p: 0.9
  top_k: 40
  max_tokens: 512
  stop:
    - "</s>"

# ---- vllm backend (guard_backend=vllm) ----
model_path: "./models/GuardReasoner-8B"
tensor_parallel_size: 2
gpu_memory_utilization: 0.8
cpu_offload_gb: 8
max_seq_len_to_capture: 8096

