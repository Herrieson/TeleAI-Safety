# Defense parameters
max_new_tokens: 512
temperature: 1.0
do_sample: false

# Soft prompt configuration
soft_prompt_dir: "dro/trained_prompts"

# Logging
log_level: "INFO"

# Attack data configuration
# Prefer project-relative paths for portability.
attack_data_path: "./attack_results"
attack_types:
  - "gcg"
  # - "past_tense"
  # - "scav"
  
target_model: "vicuna-7b-v1.5"

# API backend (optional, used when defender config does not provide local model/tokenizer)
# api_base_url: "https://api.openai.com/v1"
# api_model_name: "gpt-4o-mini"
# api_key_env: "OPENAI_API_KEY"
# api_timeout: 120

# Batch processing
batch_size: 4
save_results_dir: "./telesafety_defense/results"
resume: true
checkpoint_every: 20

