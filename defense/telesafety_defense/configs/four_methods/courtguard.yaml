defender_type: CourtGuard
detector_type: "court"
guard_action: "block"
block_message: "Request blocked: suspected prompt injection."

detector_backend:
  type: "azure_openai"
  endpoint_env: "AZURE_OPENAI_ENDPOINT"
  deployment_env: "AZURE_OPENAI_DEPLOYMENT"
  api_version: "2024-12-01-preview"
  api_key_env: "AZURE_OPENAI_API_KEY"
  system_prompt: ""

# Optional. If omitted, uses detector_backend for target generation as well.
