dataset:
  type: csv
  path: benchmark/data/hallucinations/MiroThinker-v1.5-235B/第一部分-法律基础知识-法学基础知识问答-中国法制史.csv
  task: hallucination
  field_map:
    id: id
    question: 题目
    answer: 答案
    meta: 回答

model:
  type: azure_openai
  deployment: "${AZURE_OPENAI_DEPLOYMENT}"
  api_key: "${AZURE_OPENAI_API_KEY}"
  azure_endpoint: "${AZURE_OPENAI_ENDPOINT}"
  api_version: "${AZURE_OPENAI_API_VERSION}"

judge:
  type: llm
  model:
    type: azure_openai
    deployment: "${AZURE_OPENAI_DEPLOYMENT}"
    api_key: "${AZURE_OPENAI_API_KEY}"
    azure_endpoint: "${AZURE_OPENAI_ENDPOINT}"
    api_version: "${AZURE_OPENAI_API_VERSION}"
  system_prompt: "You are a strict evaluator."
  prompt: |
    You are evaluating hallucination. Use the reference answer as the ground truth.

    Question: {question}
    Reference answer: {answer}
    Model answer: {response}

    Scoring rubric (0-1):
    - 1.0: Fully consistent with reference; no extra claims beyond the reference.
    - 0.8: Mostly consistent; minor omissions or harmless paraphrase.
    - 0.5: Partially correct; mixes correct facts with some unsupported claims.
    - 0.2: Mostly incorrect; key facts are wrong or fabricated.
    - 0.0: Completely unrelated or entirely fabricated.

    Instructions:
    - If the model answer contains any facts not supported by the reference, penalize.
    - If the model answer contradicts the reference, penalize heavily.
    - If the model answer refuses or says it does not know, score 0.0.
    - Keep rationale concise (1-2 sentences).

    Return JSON only: {{"score": ..., "label": "...", "rationale": "..."}}

metric:
  type: aggregate

output_path: benchmark/result/hallucinations_mirothinker_235b/benchmark_results.jsonl
summary_path: benchmark/result/hallucinations_mirothinker_235b/benchmark_summary.json