dataset:
  type: jsonl
  # 示例：
  # export INPUT_RESULTS_JSONL="benchmark/result/hallucinations/gpt-5/hallucinations_merged_scenario/benchmark_results.jsonl"
  path: "${INPUT_RESULTS_JSONL}"
  task: legal_scenario
  field_map:
    id: id
    question: response
    answer: answer
    # 保存原始题目，供 judge 使用
    meta: question

model:
  type: local
  mode: echo

judge:
  type: llm
  max_parse_retries: 10
  parse_retry_sleep_seconds: 1
  model:
    type: azure_openai
    deployment: "${AZURE_OPENAI_DEPLOYMENT}"
    api_key: "${AZURE_OPENAI_API_KEY}"
    azure_endpoint: "${AZURE_OPENAI_ENDPOINT}"
    api_version: "${AZURE_OPENAI_API_VERSION}"
    temperature: 0
    max_tokens: 1024
    token_param: max_completion_tokens
  system_prompt: |
    你是法律场景结论一致性裁判。
    你只能输出一个数字：1 或 0。不要输出任何其他文字。
  prompt: |
    具体要求如下：对比回答和标准答案内容。针对题目中提出的问题，如果回答中的结论与标准答案中的结论不符，则认定存在差异。
    仅判断结论是否一致，忽略推理过程和措辞细节。

    题目:"{meta}"
    回答:"{response}"
    标准答案:"{answer}"

    请根据以上要求判断结论是否一致：一致返回 1，不一致返回 0。

metric:
  type: accuracy

output_path: benchmark/result/eval_from_result/hallucinations_scenario/benchmark_results.jsonl
summary_path: benchmark/result/eval_from_result/hallucinations_scenario/benchmark_summary.json
progress_bar: true
num_workers: 32
