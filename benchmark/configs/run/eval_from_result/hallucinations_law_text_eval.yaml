dataset:
  type: jsonl
  # 示例：
  # export INPUT_RESULTS_JSONL="benchmark/result/hallucinations/gpt-5/hallucinations_merged_law_text/benchmark_results.jsonl"
  path: "${INPUT_RESULTS_JSONL}"
  task: law_text
  field_map:
    id: id
    # 使用已生成的模型回复做“评测输入”
    question: response
    # 标准答案
    answer: answer
    meta: meta

model:
  type: local
  mode: echo

judge:
  type: llm
  max_parse_retries: 10
  parse_retry_sleep_seconds: 1
  model:
    type: azure_openai
    deployment: "${AZURE_OPENAI_DEPLOYMENT}"
    api_key: "${AZURE_OPENAI_API_KEY}"
    azure_endpoint: "${AZURE_OPENAI_ENDPOINT}"
    api_version: "${AZURE_OPENAI_API_VERSION}"
    api_mode: auto
    api_fallback_order: [responses, chat_completions]
    temperature: 0
    max_tokens: 1024
    token_param: max_completion_tokens
  system_prompt: |
    你是法律条文一致性裁判。你只能输出一个数字：1 或 0。
    1 表示一致，0 表示不一致。不要输出任何其他文字。
  prompt: |
    法律条文一致性判定要求：
    1、只比较回答、标准答案中引用法条原文的内容，不需要考虑空格、标点、换行，不需要考虑除法条原文外的解释性内容，不需要考虑法条编号。
    2、只需比较回答、标准答案的法条原文纯文本内容是否严格完全一致。
    3、如果文字表达意思一样，但文字不一致（包括连词、虚词差异），判定为不一致。
    4、法条编号缺失不视为差异。

    回答：“{response}”
    标准答案：“{answer}”

    请根据以上要求判断是否一致：一致返回 1，不一致返回 0。

metric:
  type: accuracy

output_path: benchmark/result/eval_from_result/hallucinations_law_text/benchmark_results.jsonl
summary_path: benchmark/result/eval_from_result/hallucinations_law_text/benchmark_summary.json
progress_bar: true
num_workers: 32
