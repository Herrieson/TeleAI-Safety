dataset:
  type: csv
  path: benchmark/data/hallucinations/merged/第二部分-法律场景推理问答.csv
  task: legal_scenario
  field_map:
    id: id
    question: 题目
    answer: 答案

model:
  type: azure_openai
  deployment: "${AZURE_OPENAI_DEPLOYMENT}"
  api_key: "${AZURE_OPENAI_API_KEY}"
  azure_endpoint: "${AZURE_OPENAI_ENDPOINT}"
  api_version: "${AZURE_OPENAI_API_VERSION}"
  api_mode: auto
  api_fallback_order: [responses, chat_completions]
  temperature: 0
  max_tokens: 2048

judge:
  type: llm
  model:
    type: azure_openai
    deployment: "${AZURE_OPENAI_DEPLOYMENT}"
    api_key: "${AZURE_OPENAI_API_KEY}"
    azure_endpoint: "${AZURE_OPENAI_ENDPOINT}"
    api_version: "${AZURE_OPENAI_API_VERSION}"
    api_mode: auto
    api_fallback_order: [responses, chat_completions]
    temperature: 0
    max_tokens: 1024
    token_param: max_completion_tokens
  system_prompt: |
    你是法律场景结论一致性裁判。
    你只能输出一个数字：1 或 0。不要输出任何其他文字。
  prompt: |
    具体要求如下：对比回答和标准答案内容。针对题目中提出的问题，如果回答中的结论与标准答案中的结论不符，则认定存在差异。
    仅判断结论是否一致，忽略推理过程和措辞细节。

    题目:"{question}"
    回答:"{response}"
    标准答案:"{answer}"

    请根据以上要求判断结论是否一致：一致返回 1，不一致返回 0。

metric:
  type: accuracy

output_path: benchmark/result/hallucinations_merged_scenario/benchmark_results.jsonl
summary_path: benchmark/result/hallucinations_merged_scenario/benchmark_summary.json
progress_bar: true
num_workers: 32
