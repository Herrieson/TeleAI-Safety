dataset:
  type: csv
  path: benchmark/data/hallucinations/merged/第一部分-法律基础知识-法学基础知识问答.csv
  task: legal_basics
  field_map:
    id: id
    question: 题目
    answer: 答案

model:
  type: azure_openai
  deployment: "${AZURE_OPENAI_DEPLOYMENT}"
  api_key: "${AZURE_OPENAI_API_KEY}"
  azure_endpoint: "${AZURE_OPENAI_ENDPOINT}"
  api_version: "${AZURE_OPENAI_API_VERSION}"
  api_mode: auto
  api_fallback_order: [responses, chat_completions]
  temperature: 0
  max_tokens: 2048

judge:
  type: llm
  model:
    type: azure_openai
    deployment: "${AZURE_OPENAI_DEPLOYMENT}"
    api_key: "${AZURE_OPENAI_API_KEY}"
    azure_endpoint: "${AZURE_OPENAI_ENDPOINT}"
    api_version: "${AZURE_OPENAI_API_VERSION}"
    api_mode: auto
    api_fallback_order: [responses, chat_completions]
    temperature: 0
    max_tokens: 1024
    token_param: max_completion_tokens
  system_prompt: |
    你是司法考试判卷老师。
    你只能输出一个 0-100 的数字，不要输出任何其他文本。
  prompt: |
    你是一个司法考试中的判卷老师，需要判断回答是否正确，返回一个0-100的百分制得分。
    评分标准：按照回答中覆盖的答案要点进行判断；答错、漏答扣分；超出答案要点不扣分。

    题目:"{question}"
    回答:"{response}"
    标准答案:"{answer}"

    仅返回一个 0-100 的数字。

metric:
  type: aggregate

output_path: benchmark/result/hallucinations_merged_legal_basics/benchmark_results.jsonl
summary_path: benchmark/result/hallucinations_merged_legal_basics/benchmark_summary.json
progress_bar: true
num_workers: 32
