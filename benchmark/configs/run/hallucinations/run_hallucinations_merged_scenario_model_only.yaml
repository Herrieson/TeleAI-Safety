dataset:
  type: csv
  path: benchmark/data/hallucinations/merged/第二部分-法律场景推理问答.csv
  task: legal_scenario
  field_map:
    id: id
    question: 题目
    answer: 答案

model:
  type: azure_openai
  deployment: "${AZURE_OPENAI_DEPLOYMENT}"
  api_key: "${AZURE_OPENAI_API_KEY}"
  azure_endpoint: "${AZURE_OPENAI_ENDPOINT}"
  api_version: "${AZURE_OPENAI_API_VERSION}"
  api_mode: auto
  api_fallback_order: [responses, chat_completions]
  temperature: 0
  max_tokens: 2048
  token_param: max_completion_tokens

judge:
  type: noop

metric:
  type: aggregate

output_path: benchmark/result/model_only/hallucinations_merged_scenario/benchmark_results.jsonl
summary_path: benchmark/result/model_only/hallucinations_merged_scenario/benchmark_summary.json
progress_bar: true
num_workers: 32
