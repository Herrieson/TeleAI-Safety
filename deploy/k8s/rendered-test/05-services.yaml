apiVersion: v1
kind: Service
metadata:
  name: telert-web
  namespace: teleai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: teleai-safety
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: telert-bff
  namespace: teleai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: teleai-safety
    app.kubernetes.io/component: bff
  ports:
    - name: http
      port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: telert-orchestrator
  namespace: teleai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: teleai-safety
    app.kubernetes.io/component: orchestrator
  ports:
    - name: http
      port: 9001
      targetPort: 9001
