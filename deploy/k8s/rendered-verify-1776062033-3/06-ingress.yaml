apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teleai-safety
  namespace: teleai
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - teleai.example.com
      secretName: teleai-tls
  rules:
    - host: teleai.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: telert-bff
                port:
                  number: 9000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: telert-web
                port:
                  number: 80
